name: Deploy to GKE

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up Google Cloud SDK
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    # Authenticate Docker with Google Container Registry (GCR)
    - name: Authenticate Docker with GCR
      working-directory: weather-app
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    # Build and push Docker image
    - name: Build and push Docker image
      working-directory: weather-app
      run: |
        IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/weather-app
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    # Deploy to GKE
    - name: Deploy to GKE
      working-directory: weather-app
      run: |
        gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} --zone ${{ secrets.GKE_CLUSTER_ZONE }}
        kubectl apply -f kubernetes/deployment.yaml
        kubectl apply -f kubernetes/service.yaml