apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  labels:
    app: weather-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
      - name: weather-app
        image: ghm1014/weather-app:latest
        ports:
        - containerPort: 5000
        env:
        - name: WEATHER_API_KEY
          valueFrom:
            configMapKeyRef:
              name: weather-config
              key: api_key
        - name: WEATHER_API_URL
          value: "http://api.openweathermap.org/data/2.5/weather?q=Montreal&appid=${WEATHER_API_KEY}"